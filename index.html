<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6cc4ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Unscrew 3D</title>
</head>
<body>
  <div id="app">
    <header id="hud">
      <button id="btn-levels" class="round" aria-label="Level list">
        <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
      </button>
      <button id="btn-restart" class="round" aria-label="Restart level">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <div id="title-block">
        <div id="level-label">Level 1</div>
        <div id="progress"><div id="progress-fill"></div></div>
      </div>
      <button id="btn-sound" class="round" aria-label="Toggle sound">
        <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.7 1.4-1.4-1.4L18 11.3 15.7 9l-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4 2.3-2.3 2.3 2.3 1.4-1.4-2.3-2.3z"/></svg>
      </button>
    </header>

    <section id="boxes" aria-label="Colour boxes"></section>
    <section id="buffer" aria-label="Holding tray"></section>

    <main id="stage">
      <canvas id="c"></canvas>
      <div id="toast" class="hidden"></div>
    </main>

    <footer id="boosters">
      <button id="bst-slot" class="booster">
        <span class="b-icon">+</span><span class="b-label">Slot</span><span class="count">1</span>
      </button>
      <button id="bst-hint" class="booster">
        <span class="b-icon">?</span><span class="b-label">Hint</span><span class="count">3</span>
      </button>
    </footer>

    <div id="fx"></div>

    <div id="levels" class="hidden">
      <div class="panel levels-panel">
        <h2>Levels</h2>
        <div id="level-grid"></div>
        <button id="levels-close" class="btn btn-alt">Close</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="panel">
        <h2 id="ov-title">Level Complete!</h2>
        <p id="ov-text"></p>
        <div class="ov-buttons">
          <button id="ov-secondary" class="btn btn-alt">Retry</button>
          <button id="ov-primary" class="btn">Next</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
